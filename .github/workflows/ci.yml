name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build -buildvcs=false -trimpath -o bin/veilsplice ./cmd/veilsplice
